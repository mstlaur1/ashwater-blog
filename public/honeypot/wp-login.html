<!DOCTYPE html>
<html>
<head><title>Log In</title>
<meta name="robots" content="noindex, nofollow">
<style>
body{background:#f1f1f1;font-family:sans-serif;margin:0;padding:50px}
.box{max-width:320px;margin:0 auto;background:#fff;padding:26px;box-shadow:0 1px 3px rgba(0,0,0,.13)}
h1{text-align:center;color:#3c434a;font-size:20px}
input{width:100%;padding:8px;margin:8px 0;border:1px solid #8c8f94;box-sizing:border-box;font-size:16px}
button{width:100%;padding:10px;background:#2271b1;color:#fff;border:0;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h1>Admin Login</h1>
<form method="POST" action="/honeypot/cgi/login.sh">
<input name="user" placeholder="Username">
<input name="pass" type="password" placeholder="Password">
<button type="submit">Log In</button>
</form>
</div>
</body>
</html>
